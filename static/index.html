<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen Magazine</title>
  <meta name="description" content="Clear reporting on technology, science, culture and everyday life">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" id="brand">Lumen Magazine</a>
      <form class="search-form" id="search-form" role="search">
        <input type="search" id="search-input" name="q" placeholder="Search articles…" aria-label="Search articles" autocomplete="off">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="main-nav" id="main-nav" aria-label="Main"></nav>
    </div>
    <div class="announcement" id="announcement" hidden></div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p><strong id="footer-name">Lumen Magazine</strong> · <span id="footer-tagline"></span></p>
      <p class="muted">Phase 1 web platform · FastAPI + SQLAlchemy · <a href="/docs" target="_blank" rel="noopener">API docs</a></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
